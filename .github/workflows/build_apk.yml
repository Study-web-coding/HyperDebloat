name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Fix Manifest & Build Native ARM64 ADB
        run: |
          python3 -c 'import base64; open("app/src/main/AndroidManifest.xml","wb").write(base64.b64decode(""))'
          python3 -c 'import base64,os; os.system(base64.b64decode("").decode())'
          python3 -c 'import glob, os, shutil, subprocess; os.makedirs("app/src/main/jniLibs/arm64-v8a", exist_ok=True); [subprocess.run(["dpkg-deb", "-x", d, "tmp_adb"], check=True) for d in glob.glob("debs/*.deb")]; adb_bin = [f for f in glob.glob("tmp_adb/**/adb", recursive=True) if os.path.isfile(f) and not os.path.islink(f)][0]; shutil.copy2(adb_bin, "app/src/main/jniLibs/arm64-v8a/libadb.so"); os.chmod("app/src/main/jniLibs/arm64-v8a/libadb.so", 0o755); [shutil.copy2(so, f"app/src/main/jniLibs/arm64-v8a/{os.path.basename(so).split(\".so\")[0]}.so") for so in glob.glob("tmp_adb/**/*.so*", recursive=True) if os.path.isfile(so)]; print("PACKED LIBS:", os.listdir("app/src/main/jniLibs/arm64-v8a"))'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperDebloat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
