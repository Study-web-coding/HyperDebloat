name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare Manifest, Kotlin & Native Android ADB
        run: |
          python3 -c 'import base64; open("app/src/main/AndroidManifest.xml","wb").write(base64.b64decode(""))'
          python3 -c 'import base64, os, urllib.request, zipfile; os.makedirs("app/src/main/jniLibs/arm64-v8a", exist_ok=True); url = base64.b64decode("aHR0cHM6Ly9naXRodWIuY29tL211ZGl0MjAwL0FEQi1GYXN0Ym9vdC1Gb3ItQW5kcm9pZC9yYXcvbWFzdGVyL2Jpbi9hZGI=").decode(); urllib.request.urlretrieve(url, "app/src/main/jniLibs/arm64-v8a/libadb.so"); os.chmod("app/src/main/jniLibs/arm64-v8a/libadb.so", 0o755); sz = os.path.getsize("app/src/main/jniLibs/arm64-v8a/libadb.so"); assert sz > 500000, f"Bad binary size: {sz}"; print("VALID ANDROID ARM64 ADB SIZE:", sz)'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperDebloat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
