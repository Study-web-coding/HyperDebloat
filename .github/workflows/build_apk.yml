name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Fix Manifest & Launcher Icon
        run: |
          python3 -c 'import base64; open("app/src/main/AndroidManifest.xml","wb").write(base64.b64decode(""))'

      - name: Get ARM64 ADB
        run: |
          python3 -c 'import base64,os; os.system(base64.b64decode("").decode())'
          mkdir -p app/src/main/jniLibs/arm64-v8a tmp_adb
          dpkg-deb -x adb_*_arm64.deb tmp_adb
          cp $(find tmp_adb -name "adb" -type f) app/src/main/jniLibs/arm64-v8a/libadb.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libadb.so

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperDebloat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
