name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Clean Manifest & ADB
        run: |
          python3 -c 'import base64; open("app/src/main/AndroidManifest.xml","wb").write(base64.b64decode(""))'
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp $ANDROID_HOME/platform-tools/adb app/src/main/jniLibs/arm64-v8a/libadb.so || true

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperDebloat-APK
          path: app/build/outputs/apk/debug/app-debug.apk

