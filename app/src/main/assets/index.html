<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HyperDebloat</title>
<style>
:root{--bg:#09090b;--surf:#111114;--brd:#27272a;--txt:#e4e4e7;--mut:#71717a;--ok:#16a34a;--err:#dc2626;}
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--txt);padding:12px;font-size:14px;}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--brd);padding-bottom:10px;margin-bottom:10px;}
.title{font-family:monospace;font-weight:700;font-size:15px;}
.st{font-family:monospace;font-size:11px;padding:4px 8px;border:1px solid var(--brd);background:var(--surf);}
.st.on{border-color:var(--ok);color:#4ade80;} .st.off{border-color:var(--err);color:#f87171;}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
input{flex:1;min-width:110px;background:var(--surf);border:1px solid var(--brd);color:var(--txt);padding:8px;font-family:monospace;font-size:12px;}
button{background:var(--surf);border:1px solid var(--brd);color:var(--txt);padding:8px 10px;font-size:12px;}
.btn-w{background:#fafafa;color:#09090b;font-weight:600;border-color:#fafafa;}
.btn-r{background:#450a0a;border-color:#991b1b;color:#fca5a5;}
.tabs{display:flex;border-bottom:1px solid var(--brd);margin-bottom:10px;}
.tab{flex:1;background:transparent;border:none;color:var(--mut);padding:8px;border-bottom:2px solid transparent;}
.tab.act{color:var(--txt);border-bottom-color:#fafafa;}
.pane{display:none;} .pane.act{display:block;}
.list{border:1px solid var(--brd);background:var(--surf);max-height:280px;overflow-y:auto;}
.item{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--brd);align-items:center;}
.p-name{font-family:monospace;font-size:12px;display:block;}
.p-desc{font-size:11px;color:var(--mut);}
.log{margin-top:12px;border:1px solid var(--brd);background:#050507;padding:8px;font-family:monospace;font-size:11px;color:#a1a1aa;height:120px;overflow-y:auto;white-space:pre-wrap;}
.act-row{display:flex;justify-content:space-between;margin-bottom:8px;gap:6px;}
</style>
</head>
<body>
<div class="top">
  <span class="title">HYPERDEBLOAT MOBILE</span>
  <span id="st" class="st off">ADB: ожидание</span>
</div>
<div class="bar">
  <input id="ip" placeholder="IP:PORT">
  <input id="code" placeholder="Код (6 цифр)" style="max-width:105px;">
  <button id="b-pair">Pair</button>
  <button id="b-conn">Connect</button>
  <button id="b-chk">Обновить</button>
  <button id="b-cch">Кэш</button>
</div>
<div class="tabs">
  <button class="tab act" data-tab="ads">Реклама</button>
  <button class="tab" data-tab="bloat">Мусор</button>
  <button class="tab" data-tab="bak">Откат</button>
</div>
<div id="p-ads" class="pane act">
  <div class="act-row">
    <button id="s-ads-1">Все</button>
    <button id="s-ads-0">Снять</button>
    <button class="btn-w" id="r-ads">Отключить выбранное</button>
  </div>
  <div id="l-ads" class="list"></div>
</div>
<div id="p-bloat" class="pane">
  <div class="act-row">
    <button id="s-blt-1">Все</button>
    <button id="s-blt-0">Снять</button>
    <button class="btn-r" id="r-blt">Удалить выбранное</button>
  </div>
  <div id="l-bloat" class="list"></div>
</div>
<div id="p-bak" class="pane">
  <div id="l-bak" class="list"></div>
</div>
<pre id="log" class="log">Готов к работе.</pre>
<script>
const ADS = {
  "com.miui.msa.global":"[Xiaomi] Рекламный движок MSA",
  "com.miui.analytics":"[Xiaomi] MIUI Analytics",
  "com.xiaomi.joyose":"[Xiaomi] Joyose аналитика",
  "com.miui.daemon":"[Xiaomi] MIUI Daemon",
  "com.samsung.android.app.omcagent":"[Samsung] Рекомендации",
  "com.samsung.android.rubin.app":"[Samsung] Customization Service",
  "com.samsung.android.dqagent":"[Samsung] Device Quality Agent",
  "com.heytap.mcs":"[Realme/OPPO] Системная реклама",
  "com.nearme.statistics.rom":"[Realme/OPPO] Статистика",
  "com.huawei.bd":"[Huawei/Honor] Аналитика",
  "com.facebook.system":"[Meta] Facebook Installer",
  "com.facebook.appmanager":"[Meta] Facebook Manager",
  "com.facebook.services":"[Meta] Facebook Services"
};
const BLOAT = {
  "com.mi.globalbrowser":"[Xiaomi] Mi Браузер",
  "com.miui.videoplayer":"[Xiaomi] Mi Видео",
  "com.miui.player":"[Xiaomi] Mi Музыка",
  "com.xiaomi.mipicks":"[Xiaomi] GetApps",
  "com.samsung.android.bixby.agent":"[Samsung] Bixby",
  "com.samsung.android.app.spage":"[Samsung] Samsung Free",
  "com.samsung.android.game.gamehome":"[Samsung] Gaming Hub",
  "com.heytap.browser":"[Realme/OPPO] Браузер",
  "com.heytap.market":"[Realme/OPPO] App Market",
  "com.huawei.browser":"[Huawei/Honor] Браузер",
  "com.google.android.apps.tachyon":"[Google] Google Meet",
  "com.google.android.videos":"[Google] Google TV",
  "com.google.android.apps.youtube.music":"[Google] YouTube Music"
};
const SAFE = new Set(["android","com.android.systemui","com.android.settings","com.miui.home","com.miui.securitycenter","com.sec.android.app.launcher","com.huawei.android.launcher"]);
let lastV = "";

function lg(m){const e=document.getElementById('log');e.textContent+='\n'+m;e.scrollTop=e.scrollHeight;}
function sel(c,s){document.querySelectorAll('.'+c).forEach(x=>x.checked=s);}

function renderLists(){
  document.getElementById('l-ads').innerHTML = Object.entries(ADS).map(([k,v])=>'<label class="item"><input type="checkbox" class="chk c-ads" value="'+k+'" data-d="'+v+'"><div><span class="p-name">'+k+'</span><span class="p-desc">'+v+'</span></div></label>').join('');
  document.getElementById('l-bloat').innerHTML = Object.entries(BLOAT).map(([k,v])=>'<label class="item"><input type="checkbox" class="chk c-bloat" value="'+k+'" data-d="'+v+'"><div><span class="p-name">'+k+'</span><span class="p-desc">'+v+'</span></div></label>').join('');
}

function autoSel(v){
  const map={xiaomi:['[Xiaomi]','[Meta]'],samsung:['[Samsung]','[Meta]'],bbk:['[Realme/OPPO]','[Meta]'],huawei:['[Huawei/Honor]','[Meta]'],aosp:['[Meta]','[Google]']};
  const tags=map[v]||[]; let n=0;
  document.querySelectorAll('.chk').forEach(c=>{const ok=tags.some(t=>c.dataset.d.includes(t));c.checked=ok;if(ok)n++;});
  lg('Автовыбор ['+v.toUpperCase()+']: '+n+' шт.');
}

function callBridge(fn, ...args){
  if(typeof AndroidADB === 'undefined'){ lg('Ошибка: мост AndroidADB не найден'); return null; }
  return AndroidADB[fn](...args);
}

document.querySelectorAll('.tab').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.pane').forEach(x=>x.classList.remove('act'));
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('act'));
    document.getElementById('p-'+b.dataset.tab).classList.add('act');
    b.classList.add('act');
    if(b.dataset.tab==='bak') renderBak();
  });
});

document.getElementById('s-ads-1').onclick = ()=>sel('c-ads',true);
document.getElementById('s-ads-0').onclick = ()=>sel('c-ads',false);
document.getElementById('s-blt-1').onclick = ()=>sel('c-bloat',true);
document.getElementById('s-blt-0').onclick = ()=>sel('c-bloat',false);

document.getElementById('b-pair').onclick = ()=>{
  const ip=document.getElementById('ip').value.trim(), cd=document.getElementById('code').value.trim();
  if(!ip||!cd) return lg('Введите IP:PORT и 6-значный код');
  lg('Сопряжение с '+ip+'...');
  const raw=callBridge('pair',ip,cd);
  if(raw){ const r=JSON.parse(raw); lg(r.message); }
};

document.getElementById('b-conn').onclick = ()=>{
  const ip=document.getElementById('ip').value.trim();
  if(!ip) return lg('Введите IP:PORT');
  lg('Подключение к '+ip+'...');
  const raw=callBridge('connect',ip);
  if(raw){ const r=JSON.parse(raw); lg(r.message); document.getElementById('b-chk').click(); }
};

document.getElementById('b-chk').onclick = ()=>{
  const raw=callBridge('checkStatus');
  if(!raw) return;
  const r=JSON.parse(raw);
  const st=document.getElementById('st');
  if(r.connected){st.className='st on';st.textContent='ADB: '+r.device;if(r.vendor!==lastV){lastV=r.vendor;autoSel(r.vendor);}}
  else{st.className='st off';st.textContent='ADB: '+r.message;lastV='';sel('c-ads',false);sel('c-bloat',false);}
};

document.getElementById('b-cch').onclick = ()=>{
  lg('Очистка кэша...');
  const out=callBridge('trimCache');
  if(out) lg(out);
};

function runClean(cls){
  const pkgs=Array.from(document.querySelectorAll('.'+cls+':checked')).map(x=>x.value);
  if(!pkgs.length) return lg('Ничего не выбрано');
  const bak=JSON.parse(localStorage.getItem('hd_bak')||'[]');
  pkgs.forEach(p=>{
    if(SAFE.has(p)) return lg('ЗАЩИТА АНТИ-КИРПИЧ: '+p);
    const out=callBridge('uninstall',p);
    if(out){ lg(out); if(out.startsWith('Removed:') && !bak.includes(p)) bak.push(p); }
  });
  localStorage.setItem('hd_bak',JSON.stringify(bak));
}

document.getElementById('r-ads').onclick = ()=>runClean('c-ads');
document.getElementById('r-blt').onclick = ()=>runClean('c-bloat');

function renderBak(){
  const bak=JSON.parse(localStorage.getItem('hd_bak')||'[]');
  const box=document.getElementById('l-bak');
  if(!bak.length){box.innerHTML='<div style="padding:10px;color:#71717a;">Пусто</div>';return;}
  box.innerHTML=bak.map(p=>'<div class="item" style="justify-content:space-between;"><span class="p-name">'+p+'</span><button onclick="doRest(\''+p+'\')">Вернуть</button></div>').join('');
}

window.doRest = function(p){
  const out=callBridge('restore',p);
  if(out) lg(out);
  const bak=JSON.parse(localStorage.getItem('hd_bak')||'[]').filter(x=>x!==p);
  localStorage.setItem('hd_bak',JSON.stringify(bak)); renderBak();
};

renderLists();
</script>
</body>
</html>
